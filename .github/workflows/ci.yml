name: VisionGuard CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install web test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt pytest ruff
      - name: Static checks
        run: ruff check web tests --select E9,F63,F7,F82
      - name: Run tests
        run: pytest -q
      - name: Build web image
        if: matrix.python-version == '3.11'
        run: docker build -t visionguard-web:ci .
