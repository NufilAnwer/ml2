{% extends "base.html" %}
{% block content %}
<section class="panel">
  <p class="eyebrow">ANALYSIS RESULT</p>
  <h1>{{ result.label }}</h1>
  <p class="confidence">{{ "%.1f"|format(result.confidence * 100) }}% confidence</p>
  <p>Image: {{ filename }}</p>
  <p class="muted">{{ result.caveat }}</p>
  <a class="button secondary" href="{{ url_for('index') }}">Analyze another image</a>
</section>
{% endblock %}
